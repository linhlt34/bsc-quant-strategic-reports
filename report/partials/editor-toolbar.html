<div id="editor-toolbar" class="editor-toolbar" aria-label="Công cụ chỉnh sửa báo cáo">
  <button id="btn-toggle-edit" type="button" onclick="toggleEdit()">Chỉnh sửa</button>
  <button id="btn-save" type="button" onclick="saveState()" hidden>Lưu</button>
  <button id="btn-reset" type="button" onclick="resetState()" hidden>Đặt lại</button>
  <button type="button" onclick="window.print()">Xuất PDF</button>
  <span id="editor-status" class="editor-status"></span>
</div>
