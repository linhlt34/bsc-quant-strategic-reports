<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ meta.reportTitle }} | Share Card</title>
  <style>##REPORT_CSS##</style>
</head>
<body>
  <main class="share-card">
    <header class="share-topbar">
      <img src="##LOGO_BASE64##" alt="BSC Logo">
      <div><b>{{ topbar.brandLabel }}</b><span>{{ topbar.divisionLabel }}</span></div>
    </header>
    <section class="share-hero">
      <div class="share-eyebrow">{{ shareCard.eyebrow }}</div>
      <h1>{{ shareCard.headlineShort }}</h1>
    </section>
    <section class="share-stocks">##SHARE_STOCK_CARDS##</section>
    <footer class="share-footer">
      <div class="share-disclaimer">{{ shareCard.disclaimerShort }}</div>
      <div class="share-qr">##SHARE_QR_CODE##</div>
    </footer>
  </main>
</body>
</html>
