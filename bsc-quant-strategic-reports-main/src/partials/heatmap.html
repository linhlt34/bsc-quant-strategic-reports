<section class="report-section heatmap-section">
  <div class="sec-label" data-edit>{{ heatmap.sectionLabel }}</div>
  <div class="sec-sub" data-edit>{{ heatmap.sectionSub }}</div>
  <div class="heatmap-wrap">
    <table class="heatmap-table" aria-label="Heatmap lợi suất hàng tháng">
      <thead><tr><th class="year-th">Năm</th>##HEATMAP_HEADERS##</tr></thead>
      <tbody>##HEATMAP_ROWS##</tbody>
    </table>
    <div class="heatmap-legend"><span>Giảm mạnh</span><span class="legend-bar"></span><span>Tăng mạnh</span></div>
  </div>
</section>
