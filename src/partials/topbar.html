<div class="topbar">
  <div class="brand">
    <img class="brand-logo" src="##LOGO_BASE64##" alt="BSC Logo" height="42">
    <div class="brand-text">
      <span class="brand-name" data-edit>{{ topbar.brandLabel }}</span>
      <span class="brand-division" data-edit>{{ topbar.divisionLabel }}</span>
    </div>
  </div>
  <div class="topbar-meta">
    <div class="topbar-meta-line" data-edit><strong>{{ topbar.metaLine1 }}</strong></div>
    <div class="topbar-meta-line" data-edit>{{ topbar.metaLine2 }} · Phát hành: {{ meta.issueDate }}</div>
  </div>
</div>
