<article class="share-stock-card">
  <div class="share-stock-head"><b>{{ ticker }}</b><span>{{ weight }}</span></div>
  <div class="share-sector">{{ sector }}</div>
  <div class="share-metrics">
    <span>Vốn hóa <b>{{ mcap }}</b></span><span>Thanh khoản <b>{{ liq }}</b></span>
    <span>Free float <b>{{ float }}%</b></span><span>LNST svck <b>{{ growth }}%</b></span>
    <span>P/E <b>{{ pe }}x</b></span><span>P/B <b>{{ pb }}x</b></span>
  </div>
</article>
