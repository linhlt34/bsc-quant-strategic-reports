<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>{{ meta.reportTitle }} | {{ meta.period }}</title>
<style>
##THEME_FONTS##
</style>
<style>
/* ═══════════════════════════════════════════════════════════════════
   BSC QUANT RESEARCH — Print A4 Fixed Target Layout
   Hard rules: No overflow:hidden; font-size >= 12px everywhere.
   ═══════════════════════════════════════════════════════════════════ */

##THEME_CSS_VARIABLES##

/* RESET */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', system-ui, -apple-system, sans-serif;
  font-size: var(--fs-body);
  color: var(--text-1);
  line-height: 1.55;
  background: #ffffff;
  -webkit-font-smoothing: antialiased;
}

.doc {
  width: 210mm;
  margin: 0 auto;
}

/* Ép cứng kích thước trang A4 */
.sheet {
  width: 210mm;
  height: 297mm;
  background: #ffffff;
  position: relative;
  page-break-after: always;
  break-after: page;
  /* Tràn tự nhiên để Puppeteer/Edge đo đạc fail-fast */
  overflow: visible; 
}

/* Tránh ngắt trang ở giữa các phần tử quan trọng */
.hero, .board-wrap, .chart-container, .heatmap-wrap, .stock-grid, .usage-section {
  break-inside: avoid;
}

/* TOPBAR */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px var(--page-pad);
  border-bottom: 3px solid var(--bsc-blue);
  background: var(--tint-blue);
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-logo {
  height: 40px;
  width: auto;
  display: block;
}
.brand-text {
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.brand-name {
  font-size: var(--fs-h4);
  font-weight: 800;
  color: var(--bsc-blue);
  letter-spacing: -0.2px;
  line-height: 1.2;
}
.brand-division {
  font-size: var(--fs-label);
  font-weight: 700;
  color: var(--text-3);
  letter-spacing: 1.2px;
  text-transform: uppercase;
  line-height: 1;
}
.topbar-meta {
  text-align: right;
}
.topbar-meta-line {
  font-size: var(--fs-label);
  color: var(--text-3);
  line-height: 1.4;
}
.topbar-meta-line strong {
  color: var(--bsc-blue);
  font-weight: 700;
}

/* SECTION HEADINGS */
.sec-label {
  display: block;
  font-size: var(--fs-label);
  font-weight: 700;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--bsc-blue);
  padding: 16px var(--page-pad) 8px;
  line-height: 1.3;
}
.sec-sub {
  font-size: var(--fs-body-lg);
  color: var(--text-2);
  padding: 0 var(--page-pad) 16px;
  line-height: 1.6;
  max-width: 800px;
}

/* HERO SECTION */
.hero {
  padding: 16px var(--page-pad) 16px;
  border-bottom: 1px solid var(--line);
}
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-label);
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--bsc-teal);
  background: var(--tint-teal);
  border: 1px solid rgba(0,155,135,0.25);
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 12px;
}
.hero-tag::before {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--bsc-teal);
  flex-shrink: 0;
}
h1.report-title {
  font-size: var(--fs-h1);
  font-weight: 800;
  color: var(--bsc-blue);
  line-height: 1.25;
  letter-spacing: -0.4px;
  margin-bottom: 12px;
}
.lede {
  font-size: var(--fs-body-lg);
  color: var(--text-2);
  line-height: 1.65;
  max-width: 820px;
}
.fact-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
}
.fact-chip {
  font-size: var(--fs-label);
  padding: 5px 13px;
  border: 1px solid var(--line);
  border-radius: 20px;
  color: var(--text-2);
  background: var(--surface);
}
.fact-chip strong {
  color: var(--bsc-blue);
  font-weight: 700;
}

/* HERO STATS */
.hero-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 20px;
}
.hero-stat {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
  background: var(--surface);
}
.hero-stat.main {
  background: var(--tint-blue);
  border-color: rgba(41,92,169,0.3);
}
.hs-label {
  font-size: var(--fs-label);
  font-weight: 700;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  color: var(--text-3);
}
.hs-value {
  font-size: var(--fs-display);
  font-weight: 800;
  line-height: 1.1;
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
  letter-spacing: -1px;
}
.hs-value.main     { color: var(--bsc-blue); }
.hs-value.positive { color: var(--positive); }
.hs-value.neutral  { color: var(--neutral); }
.hs-value.plain    { color: var(--text-1); }
.hs-unit {
  font-size: var(--fs-body);
  font-weight: 600;
  margin-left: 3px;
  opacity: 0.7;
}
.hs-sub {
  font-size: var(--fs-label);
  color: var(--text-3);
  margin-top: 6px;
}

/* TABLE */
.board-wrap {
  padding: 0 var(--page-pad) 16px;
}
table {
  width: 100%;
  border-collapse: collapse;
}
thead th {
  text-align: left;
  font-size: var(--fs-label);
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 10px 10px;
  border-bottom: 2px solid var(--bsc-blue);
  white-space: nowrap;
}
thead th.num { text-align: right; }
tbody td {
  padding: 11px 10px;
  border-bottom: 1px solid var(--line);
  font-size: var(--fs-body);
  color: var(--text-1);
  vertical-align: middle;
}
tbody tr.total-row td {
  font-weight: 700;
  background: var(--surface);
  border-bottom: none;
  border-top: 2px solid var(--bsc-blue);
}
td.ticker-cell {
  font-size: var(--fs-h4);
  font-weight: 800;
  color: var(--bsc-blue);
}
td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
td.upside { text-align: right; font-weight: 700; color: var(--positive); font-variant-numeric: tabular-nums; }
td.sector-cell {
  font-size: var(--fs-label);
  color: var(--text-3);
}

.weight-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  justify-content: flex-end;
}
.weight-pct {
  font-size: var(--fs-body);
  font-weight: 700;
  color: var(--bsc-teal);
  font-variant-numeric: tabular-nums;
  min-width: 36px;
  text-align: right;
}
.weight-bar-track {
  flex: 1;
  min-width: 60px;
  height: 5px;
  background: var(--line);
  border-radius: 3px;
  overflow: hidden;
}
.weight-bar-fill {
  height: 100%;
  background: var(--bsc-teal);
}

/* CHART */
.chart-container {
  padding: 0 var(--page-pad) 16px;
}
.chart-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 14px;
}
.chart-title {
  font-size: var(--fs-h3);
  font-weight: 700;
  color: var(--text-1);
}
.chart-legend {
  display: flex;
  gap: 16px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-label);
  font-weight: 600;
  color: var(--text-2);
}
.legend-line {
  width: 22px;
  height: 3px;
  border-radius: 2px;
}
.chart-box {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 20px 16px 12px;
  background: var(--surface);
}
.chart-svg-wrap svg {
  display: block;
  width: 100%;
  height: 220px;
}
.chart-annotation {
  display: flex;
  gap: 24px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  margin-top: 12px;
}
.chart-ann-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.chart-ann-label {
  font-size: var(--fs-label);
  color: var(--text-3);
  font-weight: 600;
}
.chart-ann-value {
  font-size: var(--fs-h3);
  font-weight: 800;
}
.chart-ann-value.pos { color: var(--positive); }
.chart-ann-value.blue { color: var(--bsc-blue); }
.chart-ann-value.teal { color: var(--bsc-teal); }

/* HEATMAP */
.heatmap-wrap {
  padding: 0 var(--page-pad) 16px;
}
.heatmap-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 4px;
}
.heatmap-table th {
  font-size: var(--fs-label);
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  text-align: center;
}
.heatmap-table th.th-year { text-align: left; }
.heatmap-table td {
  text-align: center;
  padding: 9px 2px;
  border-radius: 6px;
  font-size: var(--fs-label);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.heatmap-table td.year-cell {
  text-align: left;
  font-size: var(--fs-body);
  font-weight: 800;
  background: transparent !important;
  color: var(--text-1);
}
.heatmap-table td.total-cell {
  font-weight: 800;
  background: var(--tint-blue) !important;
  color: var(--bsc-blue) !important;
  border: 1px solid rgba(41,92,169,0.3);
}
.heatmap-table td.empty-cell {
  background: var(--surface) !important;
  color: var(--text-3);
  font-weight: 400;
}
.heatmap-legend {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  font-size: var(--fs-label);
  color: var(--text-3);
}
.heatmap-legend .legend-bar {
  width: 120px;
  height: 8px;
  border-radius: 4px;
  background: linear-gradient(to right, #DC2626, #F8FAFC, #16A34A);
}

/* STOCK CARDS */
.stock-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
  padding: 0 var(--page-pad) 16px;
}
.stock-card {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 13px;
  background: var(--card);
  display: flex;
  flex-direction: column;
}
.sc-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.sc-ticker {
  font-size: var(--fs-h4);
  font-weight: 800;
  color: var(--bsc-blue);
}
.sc-company {
  font-size: var(--fs-label);
  color: var(--text-3);
  font-weight: 500;
}
.sc-badge {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 5px 8px;
  border-radius: 8px;
  background: var(--tint-blue);
  border: 1px solid rgba(41,92,169,0.2);
}
.sc-badge-label {
  font-size: var(--fs-label);
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-3);
}
.sc-badge-value {
  font-size: var(--fs-h4);
  font-weight: 800;
  color: var(--bsc-blue);
}
.sc-metrics {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  flex: 1;
}
.m-label {
  font-size: var(--fs-label);
  font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase;
}
.m-value {
  font-size: var(--fs-body-lg);
  font-weight: 800;
  color: var(--text-1);
}
.sc-upside {
  font-size: var(--fs-h3);
  font-weight: 800;
  color: var(--positive);
}
.sc-action {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--line);
}
.btn-report {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--bsc-blue);
  color: #fff;
  text-decoration: none;
  font-size: var(--fs-label);
  font-weight: 700;
  padding: 7px 14px;
  border-radius: 7px;
  width: 100%;
}

/* FOOTER */
.usage-section {
  margin: 0 var(--page-pad);
  padding: 16px 0 14px;
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 24px;
}
.usage-title {
  font-size: var(--fs-label);
  font-weight: 700;
  text-transform: uppercase;
  color: var(--bsc-blue);
  margin-bottom: 8px;
}
.usage-text, .contact-block {
  font-size: var(--fs-caption);
  color: var(--text-3);
}
.usage-text p { margin-bottom: 5px; }
.usage-text .copyright { color: var(--text-1); font-weight: 700; }
.contact-item {
  margin-bottom: 8px;
}
.contact-item strong { color: var(--text-1); font-weight: 700; display: block; }

.page-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px var(--page-pad) 14px;
  border-top: 1px solid var(--line);
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
}
.footer-disc {
  font-size: var(--fs-caption);
  color: var(--text-3);
  max-width: 720px;
}
.page-num {
  font-size: var(--fs-label);
  font-weight: 700;
  color: var(--text-3);
}

/* PRINT MEDIA OVERRIDES */
@page {
  size: A4 portrait;
  margin: 0;
}
@media print {
  body {
    background: #ffffff !important;
  }
  * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  .sheet {
    page-break-after: always !important;
    break-after: page !important;
  }
  .sheet:last-child {
    page-break-after: avoid !important;
    break-after: avoid !important;
  }
  .chart-svg-wrap svg {
    height: 190px !important;
  }
  .board-wrap table tbody td {
    padding: 8px 10px !important;
  }
  .stock-card {
    padding: 10px 10px !important;
  }
  .sec-label {
    padding-top: 16px !important;
  }
}

/* Reference alignment: keep table/chart/card/font/color format consistent with the approved editable HTML. */
body, button, input, select, textarea, table, th, td, svg text { font-family: 'Nunito', system-ui, -apple-system, sans-serif !important; }
body { color: var(--text); background: var(--bg-canvas); padding: var(--gap-section) 12px; line-height: 1.5; }
.doc { max-width: 1000px; gap: var(--gap-section); }
.sheet { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(15,23,42,.05); }
.topbar { padding: 16px var(--page-pad); border-bottom: 3px solid var(--bsc-blue); background: var(--blue-tint); }
.brand-logo { height: 42px; }
.brand-name { font-size: 19px; font-weight: 800; color: var(--bsc-blue); letter-spacing: -0.2px; }
.brand-division, .topbar-meta-line { color: var(--dim); }
.sec-label { display: block; font-size: var(--fs-label) !important; letter-spacing: 1.5px !important; color: var(--bsc-blue) !important; font-weight: 700 !important; text-transform: uppercase !important; padding: calc(var(--gap-section) + 4px) var(--page-pad) 12px !important; line-height: 1.4 !important; }
.sec-sub { font-size: var(--fs-caption); color: var(--dim); padding: 0 var(--page-pad) 16px; margin-top: -4px; max-width: 720px; line-height: 1.6; }
.hero { padding: calc(var(--gap-section) + 4px) var(--page-pad); border-bottom: 1px solid var(--line); }
.hero-tag { display: none; }
h1.report-title { font-size: var(--fs-h1); font-weight: 800; color: var(--bsc-blue); line-height: 1.25; letter-spacing: -0.5px; margin: 8px 0 0; }
.lede { margin-top: 12px; font-size: var(--fs-body); line-height: 1.75; color: var(--dim); max-width: none; width: 100%; text-align: justify; }
.fact-chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; align-items: center; }
.fact-chip { font-size: var(--fs-label); padding: 6px 14px; border: 1px solid var(--line); border-radius: 20px; color: var(--dim); background: var(--surface); }
.fact-chip strong { color: var(--bsc-blue); }
.hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: var(--gap-section); }
.hero-stat { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: var(--surface); }
.hero-stat.main { background: var(--blue-tint); border-color: var(--bsc-blue); }
.hs-label { font-size: var(--fs-label); letter-spacing: .5px; color: var(--dim); font-weight: 700; text-transform: uppercase; line-height: 1.3; }
.hs-value { font-size: var(--fs-h2); font-weight: 800; margin-top: 6px; line-height: 1.1; letter-spacing: 0; }
.hs-value.main, .hs-value.positive, .hs-value.neutral { color: var(--bsc-blue); }
.hs-value.plain { color: var(--text); }
.hs-sub { font-size: var(--fs-caption); color: var(--dim); margin-top: 6px; font-weight: 600; }
.board-wrap { padding: 0 var(--page-pad) var(--gap-section); overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; min-width: 700px; border-collapse: collapse; table-layout: fixed; }
thead th { font-size: var(--fs-label); letter-spacing: .6px; color: var(--dim); font-weight: 700; padding: 12px 8px; border-bottom: 2px solid var(--bsc-blue); text-transform: uppercase; }
tbody td { padding: 12px 8px; border-bottom: 1px solid var(--line); font-size: var(--fs-body); color: var(--text); vertical-align: middle; }
tbody tr:hover td { background: var(--surface); }
tbody tr:last-child td, tbody tr.total-row td { border-bottom: none; font-weight: 700; background: var(--surface); border-top: 0; }
td.ticker, td.ticker-cell { font-weight: 700; font-size: var(--fs-body); color: var(--bsc-blue); }
td.sector, td.sector-cell { color: var(--dim); font-size: var(--fs-label); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td.price, td.num, td.upside { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
td.upside { color: var(--positive); }
.weight-inline, .weight-wrap { display: flex; align-items: center; justify-content: flex-end; gap: 10px; width: 100%; }
.weight-num, .weight-pct { min-width: 40px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; font-size: var(--fs-body); color: var(--bsc-blue); line-height: 1; flex-shrink: 0; }
.weight-bar-track { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; flex: 1; min-width: 110px; }
.weight-bar-fill { height: 100%; background: var(--bsc-blue); border-radius: 2px; }
.chart-container { padding: 0 var(--page-pad) var(--gap-section); }
.chart-box { border: 1px solid var(--line); border-radius: 12px; padding: 20px; background: var(--surface); position: relative; }
.chart-header, .chart-title, .chart-annotation { display: none; }
.chart-legend, .chart-legend-top { display: flex; gap: 20px; font-size: var(--fs-caption); font-weight: 600; margin-bottom: 16px; justify-content: flex-end; color: var(--text); }
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-line { width: 24px; height: 3px; border-radius: 2px; }
svg { display: block; width: 100%; height: auto; }
.chart-svg-wrap svg { height: auto; }
.heatmap-wrap { padding: 0 var(--page-pad) var(--gap-section); overflow-x: auto; -webkit-overflow-scrolling: touch; }
.heatmap-table { width: 100%; min-width: 650px; border-collapse: separate; border-spacing: 4px; font-size: var(--fs-label); }
.heatmap-table th { font-size: var(--fs-label); letter-spacing: .4px; color: var(--dim); font-weight: 700; text-transform: uppercase; text-align: center; padding-bottom: 4px; }
.heatmap-table td { text-align: center; padding: 11px 2px; border-radius: 6px; font-size: var(--fs-label); font-weight: 700; font-variant-numeric: tabular-nums; }
.heatmap-table td.year-cell { text-align: left; font-weight: 800; padding-left: 6px; background: none !important; color: var(--text); font-size: var(--fs-body); }
.heatmap-table td.total-cell { font-weight: 800; background: var(--blue-tint) !important; color: var(--bsc-blue) !important; border: 1px solid var(--bsc-blue); }
.heatmap-legend { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: var(--fs-caption); color: var(--dim); }
.heatmap-legend .legend-bar { width: 140px; height: 8px; border-radius: 4px; background: linear-gradient(to right, #EF4444, #FFFFFF, #22C55E); }
.stock-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; padding: 0 var(--page-pad) var(--gap-section); align-items: stretch; }
.stock-card { grid-column: span 2; min-height: 264px; border: 1px solid var(--line); border-radius: 12px; padding: 15px 16px; background: var(--card); display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
.sc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; min-height: 42px; margin: 0; padding: 0; border: 0; }
.sc-ticker, .sc-head .sc-ticker { font-size: var(--fs-h4); line-height: 1.3; font-weight: 800; color: var(--bsc-blue); }
.sc-sector, .sc-company { font-size: var(--fs-label); color: var(--dim); font-weight: 500; }
.sc-badge { min-width: 54px; text-align: center; font-size: var(--fs-body); line-height: 1; font-weight: 800; letter-spacing: 0; padding: 7px 10px; border-radius: 8px; white-space: nowrap; color: var(--bsc-blue); background: var(--blue-tint); border: 1px solid rgba(41,92,169,.25); }
.sc-badge-label { display: none; }
.sc-badge-value { font-size: var(--fs-body); color: var(--bsc-blue); }
.sc-metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px 12px; margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--line); flex: 1; }
.m-label, .sc-metrics .m-label { font-size: var(--fs-label); line-height: 1.3; letter-spacing: .3px; color: var(--dim); font-weight: 700; text-transform: uppercase; }
.m-value, .sc-metrics .m-value { font-size: var(--fs-body); font-weight: 800; margin-top: 4px; color: var(--text); font-variant-numeric: tabular-nums; }
.btn-report, .btn-link { display: inline-flex; align-items: center; justify-content: center; background: var(--bsc-blue); color: #FFFFFF; text-decoration: none; font-size: var(--fs-label); font-weight: 700; padding: 7px 12px; border-radius: 6px; width: auto; }
.page-footer, footer { padding: 20px var(--page-pad) 24px; border-top: 1px solid var(--line); }
.footer-disc, footer .disc { font-size: var(--fs-caption); color: var(--dim); line-height: 1.6; text-align: justify; }
@media (max-width: 768px) { .hero-stats { grid-template-columns: repeat(2, 1fr); } .stock-grid { grid-template-columns: 1fr; } .stock-card { grid-column: auto; height: auto; min-height: 264px; } }
