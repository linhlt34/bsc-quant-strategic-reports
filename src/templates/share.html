<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>{{ meta.reportTitle }}</title>
<style>
##THEME_CSS_VARIABLES##

/* Override riêng cho bản chụp ảnh Share */
body {
    zoom: 1.3;
    padding: 0 !important;
    background: #FFFFFF !important;
}
.doc {
    max-width: 1000px !important;
    box-shadow: none !important;
    border: none !important;
    padding: 24px 16px !important;
    gap: 16px !important;
}
.sheet {
    box-shadow: none !important;
    border: none !important;
    border-radius: 0 !important;
}
</style>
</head>
<body class="inline-editor-ready">
<div class="doc">
<div class="sheet">
##PARTIAL_HERO##
##PARTIAL_CHART##
<div class="sec-label" style="padding: 0 32px 12px !important;">CHI TIẾT MÃ CỔ PHIẾU</div>
<div class="stock-grid" style="grid-template-columns: repeat(2, minmax(0, 1fr));">
##SHARE_STOCK_CARDS##
</div>

<footer style="margin: 24px 32px 32px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 24px;">
    <div class="disclaimer-block">
        <div class="cta-title" style="font-size: 14px; font-weight: 800; color: var(--bsc-blue); margin-bottom: 6px; text-transform: uppercase;">KHUYẾN CÁO SỬ DỤNG</div>
        <p class="disclaimer-text" style="font-size: 12px; color: var(--dim); max-width: 600px; line-height: 1.5; text-align: justify;">{{ shareCard.disclaimerShort }}</p>
    </div>
    <div class="qr-block" style="display: flex; align-items: center; gap: 16px;">
        <div class="qr-svg-wrap" style="width: 72px; height: 72px;">
            ##SHARE_QR_CODE##
        </div>
        <div class="qr-text" style="font-size: 14px; font-weight: 700; color: var(--dim);">
            Quét mã để xem<br><span style="color: var(--bsc-blue);">Báo cáo chi tiết</span>
        </div>
    </div>
</footer>

</div>
</div>
</body>
</html>
